name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  verify-binaries:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify xcframeworks
        run: |
          set -e
          for fw in Frameworks/*.xcframework; do
            name=$(basename "$fw" .xcframework)
            echo "=== $name ==="
            plutil -lint "$fw/Info.plist"
            binary=$(find "$fw" -type f -name "$name" -path "*.framework/*" | head -1)
            if [ -z "$binary" ]; then
              echo "::error::No binary found for $name"
              exit 1
            fi
            echo "Binary: $binary"
            file "$binary" | grep -q "Mach-O" || { echo "::error::$binary is not a valid Mach-O binary"; exit 1; }
            file "$binary"
          done
